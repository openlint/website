---
layout: default
---
<p class="muted">{{ page.date | date: "%-d %B %Y" }}{% if page.author %} · {{ page.author }}{% endif %}</p>
<h1>{{ page.title }}</h1>
{% if page.image %}<img class="hero" src="{{ page.image }}" alt="{{ page.image_alt | escape }}">{% endif %}
<div class="post">
{{ content }}
</div>
