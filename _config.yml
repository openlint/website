title: OpenLint
share_image: /assets/openlint-card.jpg
share_image_alt: "The OpenLint logo, two lines of code over a wavy underline that resolves into a check mark, beside the name OpenLint and the tagline"
description: An open specification and toolbox for linting API artifacts — a community fork of Spectral, stewarded in the open.
url: https://openlint.org

permalink: /blog/:year/:month/:day/:title/

plugins:
  - jekyll-redirect-from

collections:
  meetings:
    output: true
    permalink: /meetings/:path/

meeting_types:
  office-hours:
    name: Office Hours
    summary: A weekly open call where anyone can bring questions, proposals and objections about the specification, the toolbox and how the project is run.

exclude:
  - README.md
  - CNAME
