# One entry per openlint CLI release, newest first. Checked weekly, before office hours.
# Each entry links the GitHub Release, which sums up every package in the release.
- version: "1.2.0"
  date: 2026-11-12
  url: https://github.com/openlint/openlint/releases/tag/openlint@1.2.0
  summary: "Core rulesets split into their own packages: spectral:* frozen, openlint:* evolving. Nine documentation rules moved from openlint:openapi to the opt-in ruleset-documentation. Opt-in nestedResultCache for the schema function."
  changes:
    - text: Rulesets spun out into packages
      url: https://github.com/openlint/openlint/pull/42
    - text: nestedResultCache option for the schema function
      url: https://github.com/openlint/openlint/pull/39
